spring.application.name=inventory-service
spring.datasource.url=jdbc:mysql://localhost:3307/inventory_service
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=8082

# Inventory reservation expiration time in minutes (default: 1440 minutes = 24 hours)
inventory.reservation.expiration-minutes=1440

# Outbox configuration 方便Order-Service-1 的InventoryResultConsumer类 监听这个outbox 
# inventory.outbox.topic=inventory.events #对应Order-Service-1 配置文件的 inventory.event.topic=inventory.events 
inventory.outbox.topic=inventory.events
# previous value: 5000
inventory.outbox.fixed-delay-ms=3000
#inventory.outbox.max-retries=3
# include the first attempt, so the total number of attempts is 4 , 包括首次发送，正常记录每次失败时最多尝试 4 次
inventory.outbox.max-attempts=4
inventory.outbox.publisher.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

## kafka consumer configuration   
# inventory.command.topic=inventory.commands  对应Order-Service-1 配置文件的 inventory.command.topic=inventory.commands
inventory.command.topic=inventory.commands
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

### Outbox monitoring configuration
#启用这个监控组件
outbox.monitor.enabled=true
# 每轮统计完成后，等待 10 秒再执行
outbox.monitor.fixed-delay-ms=10000
# 监控组件启动后，等待 1 秒再执行
outbox.monitor.initial-delay-ms=1000

### Actuator endpoint configuration
#通过 HTTP 暴露健康检查和 Prometheus 指标
management.endpoints.web.exposure.include=health,prometheus
#不返回详细健康信息
management.endpoint.health.show-details=never
