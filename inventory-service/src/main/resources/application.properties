spring.application.name=inventory-service
spring.datasource.url=jdbc:mysql://localhost:3307/inventory_service
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=8082

# Inventory reservation expiration time in minutes (default: 1440 minutes = 24 hours)
inventory.reservation.expiration-minutes=1440

# Outbox configuration
inventory.outbox.topic=inventory.events
# previous value: 5000
inventory.outbox.fixed-delay-ms=3000
inventory.outbox.max-retries=3
inventory.outbox.publisher.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

##kafka consumer configuration
inventory.command.topic=inventory.commands
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer