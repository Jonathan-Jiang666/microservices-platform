spring.application.name=order-service
spring.datasource.url=jdbc:mysql://localhost:3306/order_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Dublin
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=none
server.port=8081

inventory.service.url = http://localhost:8082
inventory.service.username=admin
inventory.service.password=admin


## Outbox configuration
order.outbox.topic=order.events
inventory.command.topic=inventory.commands
order.outbox.fixed-delay-ms=3000
order.outbox.max-retries=3
order.outbox.publisher.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


####kafka consumer configuration
inventory.event.topic=inventory.events
spring.kafka.consumer.group-id=order-service-inventory-events
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.auto-startup=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

## Outbox publisher configuration
inventory.outbox.publisher.enabled=false
