spring.application.name=order-service
spring.datasource.url=jdbc:mysql://localhost:3306/order_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Dublin
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=none
server.port=8081

inventory.service.url = http://localhost:8082
inventory.service.username=admin
inventory.service.password=admin


## Outbox configuration 方便Inventory-Service 的InventoryCommandConsumer类 监听这个outbox
order.outbox.topic=order.events
##对应 Inventory-Service 配置文件的 inventory.command.topic=inventory.commands
inventory.command.topic=inventory.commands
order.outbox.fixed-delay-ms=3000
#order.outbox.max-retries=3
order.outbox.max-attempts=4
order.outbox.publisher.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


####kafka consumer configuration 方便让Inventory-Service 的InventoryCommandConsumer类 监听这个outbox
# 与 Inventory-Service 的配置文件对应
inventory.event.topic=inventory.events
spring.kafka.consumer.group-id=order-service-inventory-events
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.auto-startup=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

## Outbox publisher configuration
inventory.outbox.publisher.enabled=false


### Outbox monitoring configuration
#启用这个监控组件
outbox.monitor.enabled=true
# 每轮统计完成后，等待 10 秒再执行
outbox.monitor.fixed-delay-ms=10000
# 监控组件启动后，等待 1 秒再执行
outbox.monitor.initial-delay-ms=1000

### Actuator endpoint configuration
#通过 HTTP 暴露健康检查和 Prometheus 指标
management.endpoints.web.exposure.include=health,prometheus
#不返回详细健康信息
management.endpoint.health.show-details=never
